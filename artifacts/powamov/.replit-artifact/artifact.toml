kind = "web"
previewPath = "/"
title = "POWAMOV Intelligence Dashboard"
version = "1.0.0"
id = "artifacts/powamov"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20716

[services.development]
run = "pnpm --filter @workspace/powamov run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/powamov", "run", "build" ]
publicDir = "artifacts/powamov/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20716"
BASE_PATH = "/"
